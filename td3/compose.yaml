name: td3

services:
  api:
    build:
      context: ./app
      target: prod
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://cache:6379
    depends_on:
      - db
      - cache
    restart: on-failure

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql

  cache:
    image: redis:8-alpine
    volumes:
      - cache-data:/data

volumes:
  db-data:
  cache-data:
